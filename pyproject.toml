[project]
name = "nexon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "elevenlabs>=2.56.0",
    "langchain-anthropic>=1.4.8",
    "langchain-core>=1.4.8",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "pyside6>=6.8",
    "pillow>=12.3.0",
    "pyorbbecsdk2>=2.0.18",
    "torch>=2.12.1",
    "transformers>=5.13.0",
]

[project.scripts]
nexon = "nexon.app:main"
nexon-ui = "nexon.ui.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexon"]
